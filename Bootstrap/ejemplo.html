<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href="CSS/ejemplo.css">
</head>

<body>
    <main class="container-fluid">

        <div class="row">
            <!-- usar div.col-2 para cera columnas mas rapido -->
            <div class="col-2 caja verde"></div>
            <div class="col-3 caja naranja"></div>
            <div class="col-4 caja azul"></div>
            <div class="col-3 caja amarillo"></div>
        </div>

        <div class="row">
            <div class="col-5 caja azul"></div>
            <div class="col-7 caja verde"></div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
